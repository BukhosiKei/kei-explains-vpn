<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1830"/>
      <stop offset="100%" stop-color="#050D1C"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg3)"/>

  <!-- city night skyline -->
  <g fill="#0B1F3A">
    <rect x="0" y="500" width="120" height="800"/>
    <rect x="120" y="600" width="90" height="700"/>
    <rect x="210" y="420" width="140" height="880"/>
    <rect x="350" y="540" width="100" height="760"/>
    <rect x="450" y="380" width="180" height="920"/>
    <rect x="630" y="480" width="120" height="820"/>
    <rect x="750" y="560" width="100" height="740"/>
    <rect x="850" y="440" width="140" height="860"/>
    <rect x="990" y="600" width="90" height="700"/>
  </g>

  <!-- windows -->
  <g fill="#20A4FF" opacity="0.7">
    <rect x="40" y="560" width="8" height="10"/>
    <rect x="70" y="600" width="8" height="10"/>
    <rect x="250" y="480" width="8" height="10"/>
    <rect x="280" y="540" width="8" height="10"/>
    <rect x="500" y="440" width="8" height="10"/>
    <rect x="540" y="500" width="8" height="10"/>
    <rect x="900" y="500" width="8" height="10"/>
    <rect x="940" y="560" width="8" height="10"/>
  </g>

  <!-- balcony foreground -->
  <rect x="0" y="1240" width="1080" height="680" fill="#0B1F3A" opacity="0.9"/>
  <line x1="0" y1="1240" x2="1080" y2="1240" stroke="#20A4FF" stroke-width="3"/>

  <!-- railing bars -->
  <g stroke="#8DD8FF" stroke-width="2" opacity="0.6">
    <line x1="100" y1="1240" x2="100" y2="1420"/>
    <line x1="200" y1="1240" x2="200" y2="1420"/>
    <line x1="300" y1="1240" x2="300" y2="1420"/>
    <line x1="400" y1="1240" x2="400" y2="1420"/>
    <line x1="500" y1="1240" x2="500" y2="1420"/>
    <line x1="600" y1="1240" x2="600" y2="1420"/>
    <line x1="700" y1="1240" x2="700" y2="1420"/>
    <line x1="800" y1="1240" x2="800" y2="1420"/>
    <line x1="900" y1="1240" x2="900" y2="1420"/>
    <line x1="1000" y1="1240" x2="1000" y2="1420"/>
  </g>
</svg>