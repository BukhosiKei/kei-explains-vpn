    <circle cx="28" cy="108" r="14" fill="#0B1F3A" stroke="#8DD8FF" stroke-width="3"/>
    <circle cx="92" cy="108" r="14" fill="#0B1F3A" stroke="#8DD8FF" stroke-width="3"/>
  </g>

  <!-- car 2 (right lane) — envelope shape -->
  <g transform="translate(760,1330)">
    <rect x="0" y="20" width="120" height="80" rx="14" fill="#20A4FF" stroke="#8DD8FF" stroke-width="3"/>
    <rect x="20" y="0" width="80" height="40" rx="10" fill="#20A4FF" opacity="0.9"/>
