    <rect x="0" y="20" width="120" height="80" rx="14" fill="#20A4FF" stroke="#8DD8FF" stroke-width="3"/>
    <rect x="20" y="0" width="80" height="40" rx="10" fill="#20A4FF" opacity="0.9"/>
