<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#050D1C"/>

  <!-- cityscape -->
  <g fill="#0B1F3A">
    <rect x="0" y="700" width="140" height="900"/>
    <rect x="140" y="600" width="100" height="1000"/>
    <rect x="240" y="520" width="180" height="1080"/>
    <rect x="420" y="640" width="120" height="960"/>
    <rect x="540" y="480" width="220" height="1120"/>
    <rect x="760" y="600" width="140" height="1000"/>
    <rect x="900" y="680" width="180" height="920"/>
  </g>

  <!-- VPN server building (right) -->
  <g transform="translate(700,720)">
    <rect x="0" y="0" width="280" height="700" rx="16"
          fill="#0B1F3A" stroke="#20A4FF" stroke-width="6"/>
    <!-- windows grid -->
    <g fill="#20A4FF" opacity="0.85">
      <rect x="30" y="60" width="40" height="50"/>
      <rect x="90" y="60" width="40" height="50"/>
      <rect x="150" y="60" width="40" height="50"/>
      <rect x="210" y="60" width="40" height="50"/>

      <rect x="30" y="140" width="40" height="50"/>
      <rect x="90" y="140" width="40" height="50"/>
      <rect x="150" y="140" width="40" height="50"/>
      <rect x="210" y="140" width="40" height="50"/>
    </g>

    <!-- shield logo on the building -->
    <g transform="translate(70,240)">
      <path d="M 70 0 L 140 30 L 140 110 Q 140 190 70 230 Q 0 190 0 110 L 0 30 Z"
            fill="#20A4FF" stroke="#8DD8FF" stroke-width="3"/>
      <path d="M 50 100 Q 50 70 70 70 Q 90 70 90 100 L 90 115"
            stroke="#071426" stroke-width="6" fill="none" stroke-linecap="round"/>
      <rect x="45" y="115" width="50" height="45" rx="6" fill="#071426"/>
    </g>

    <!-- label -->
    <text x="140" y="530" font-family="Arial, sans-serif" font-size="36"
          font-weight="700" fill="#20A4FF" text-anchor="middle"
          letter-spacing="3">VPN SERVER</text>
  </g>
</svg>