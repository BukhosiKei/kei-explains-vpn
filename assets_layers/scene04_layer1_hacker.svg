<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- hacker character close up -->
  <g transform="translate(180,600)">
    <!-- hood -->
    <path d="M 40 200 Q 40 40 260 40 Q 480 40 480 200 L 480 500 L 40 500 Z"
          fill="#0B1F3A" stroke="#20A4FF" stroke-width="4"/>

    <!-- face in shadow -->
    <ellipse cx="260" cy="270" rx="130" ry="140" fill="#1A0F0A"/>

    <!-- eyes looking through -->
    <circle cx="220" cy="260" r="12" fill="#20A4FF"/>
    <circle cx="300" cy="260" r="12" fill="#20A4FF"/>
    <circle cx="220" cy="260" r="5" fill="#F5F9FF"/>
    <circle cx="300" cy="260" r="5" fill="#F5F9FF"/>

    <!-- hands with binoculars -->
    <rect x="140" y="380" width="90" height="70" rx="12"
          fill="#1E3A8A" stroke="#20A4FF" stroke-width="3"/>
    <rect x="290" y="380" width="90" height="70" rx="12"
          fill="#1E3A8A" stroke="#20A4FF" stroke-width="3"/>
  </g>
</svg>