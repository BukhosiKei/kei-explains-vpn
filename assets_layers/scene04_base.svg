<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#050D1C"/>

  <!-- stressed background pattern -->
  <g stroke="#0B1F3A" stroke-width="1">
    <line x1="0" y1="100" x2="1080" y2="100"/>
    <line x1="0" y1="300" x2="1080" y2="300"/>
    <line x1="0" y1="500" x2="1080" y2="500"/>
    <line x1="0" y1="900" x2="1080" y2="900"/>
    <line x1="0" y1="1200" x2="1080" y2="1200"/>
    <line x1="0" y1="1500" x2="1080" y2="1500"/>
    <line x1="0" y1="1800" x2="1080" y2="1800"/>
  </g>

  <!-- envelope stream below -->
  <g>
    <rect x="100" y="1560" width="120" height="80" rx="12"
          fill="#0B1F3A" stroke="#20A4FF" stroke-width="3" opacity="0.7"/>
    <rect x="260" y="1560" width="120" height="80" rx="12"
          fill="#0B1F3A" stroke="#20A4FF" stroke-width="3" opacity="0.85"/>
    <rect x="420" y="1560" width="120" height="80" rx="12"
          fill="#0B1F3A" stroke="#20A4FF" stroke-width="3"/>
    <rect x="580" y="1560" width="120" height="80" rx="12"
          fill="#0B1F3A" stroke="#20A4FF" stroke-width="3"/>
    <rect x="740" y="1560" width="120" height="80" rx="12"
          fill="#0B1F3A" stroke="#FF3B3B" stroke-width="4"/>
    <rect x="900" y="1560" width="120" height="80" rx="12"
          fill="#0B1F3A" stroke="#FF3B3B" stroke-width="4"/>
  </g>
</svg>