          font-weight="700" fill="#071426" text-anchor="middle">DATA</text>
  </g>

  <g transform="translate(480,1220)">
    <rect x="0" y="0" width="90" height="60" rx="9"
          fill="#20A4FF" stroke="#8DD8FF" stroke-width="3"/>
