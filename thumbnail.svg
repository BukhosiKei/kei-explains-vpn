<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#0B1F3A" stroke-width="1"/>
    </pattern>
    <radialGradient id="coolGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20A4FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#20A4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8DD8FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8DD8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="#071426"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <circle cx="540" cy="880" r="440" fill="url(#coolGlow)"/>

  <!-- ============ HEADLINE ============ -->
  <text x="540" y="280" font-family="Arial, sans-serif" font-size="80"
        font-weight="700" fill="#F5F9FF" text-anchor="middle"
        letter-spacing="-2">EVERY NETWORK</text>
  <text x="540" y="380" font-family="Arial, sans-serif" font-size="80"
        font-weight="700" fill="#F5F9FF" text-anchor="middle"
        letter-spacing="-2">CAN SEE YOU.</text>

  <text x="540" y="540" font-family="Arial, sans-serif" font-size="96"
        font-weight="700" fill="#20A4FF" text-anchor="middle"
        letter-spacing="-2">HERE'S HOW</text>
  <text x="540" y="650" font-family="Arial, sans-serif" font-size="96"
        font-weight="700" fill="#20A4FF" text-anchor="middle"
        letter-spacing="-2">TO STOP IT</text>

  <!-- ============ VISUAL — tunnel + shield ============ -->
  <circle cx="540" cy="1080" r="330" fill="url(#shieldHalo)" opacity="0.5"/>

  <!-- tunnel rings -->
  <ellipse cx="540" cy="1080" rx="380" ry="380" fill="none"
           stroke="#20A4FF" stroke-width="4" opacity="0.35"/>
  <ellipse cx="540" cy="1080" rx="310" ry="310" fill="none"
           stroke="#20A4FF" stroke-width="4" opacity="0.55"/>
  <ellipse cx="540" cy="1080" rx="240" ry="240" fill="none"
           stroke="#8DD8FF" stroke-width="4" opacity="0.7"/>
  <ellipse cx="540" cy="1080" rx="170" ry="170" fill="none"
           stroke="#8DD8FF" stroke-width="3" opacity="0.85"/>
  <ellipse cx="540" cy="1080" rx="100" ry="100" fill="#0B1F3A"/>
  <ellipse cx="540" cy="1080" rx="50" ry="50" fill="#20A4FF" opacity="0.9"/>

  <!-- shield in the middle -->
  <g transform="translate(420,960)">
    <path d="M 120 0 L 240 46 L 240 172 Q 240 292 120 360 Q 0 292 0 172 L 0 46 Z"
          fill="#0B1F3A" stroke="#20A4FF" stroke-width="6"/>

    <!-- padlock -->
    <path d="M 86 120 Q 86 80 120 80 Q 154 80 154 120 L 154 140"
          stroke="#20A4FF" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="70" y="140" width="100" height="90" rx="12" fill="#20A4FF"/>
    <circle cx="120" cy="180" r="10" fill="#071426"/>
    <rect x="116" y="180" width="8" height="24" fill="#071426"/>

    <text x="120" y="290" font-family="Arial, sans-serif" font-size="40"
          font-weight="700" fill="#20A4FF" text-anchor="middle"
          letter-spacing="4">VPN</text>
  </g>

  <!-- small travel dots around the tunnel -->
  <circle cx="200" cy="900" r="10" fill="#20A4FF"/>
  <circle cx="180" cy="1080" r="10" fill="#8DD8FF"/>
  <circle cx="200" cy="1260" r="10" fill="#20A4FF"/>
  <circle cx="880" cy="900" r="10" fill="#20A4FF"/>
  <circle cx="900" cy="1080" r="10" fill="#8DD8FF"/>
  <circle cx="880" cy="1260" r="10" fill="#20A4FF"/>

  <!-- ============ PAYOFF ============ -->
  <rect x="140" y="1520" width="800" height="140" rx="24"
        fill="#0B1F3A" stroke="#20A4FF" stroke-width="5"/>
  <text x="540" y="1610" font-family="Arial, sans-serif" font-size="56"
        font-weight="700" fill="#20A4FF" text-anchor="middle"
        letter-spacing="2">VPN = PRIVATE TUNNEL</text>

  <!-- ============ BRAND ============ -->
  <text x="540" y="1840" font-family="Arial, sans-serif" font-size="34"
        font-weight="700" fill="#20A4FF" text-anchor="middle"
        letter-spacing="6">KEI EXPLAINS</text>
</svg>